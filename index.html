<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  </head>
  <body>
    <header class="py-5">
      <div class="max-w-[950px] mx-auto px-4 flex flex-col items-end">
        <button class="w-[30px] h-[30px] mb-5 md:hidden">
          <svg
            width="30"
            height="20"
            viewBox="0 0 30 20"
            fill="none"
            xmlns="http://www.w3.org/2000/svg"
          >
            <path d="M0 0.800049H30" stroke="#21243D" stroke-width="1.6" />
            <path d="M0 9.80005H30" stroke="#21243D" stroke-width="1.6" />
            <path d="M0 18.8H30" stroke="#21243D" stroke-width="1.6" />
          </svg>
        </button>
        <nav class="hidden w-full bg-slate-100 py-4 md:block md:bg-white">
          <ul
            class="flex flex-col justify-center items-center gap-4 md:flex-row md:justify-end md:gap-6"
          >
            <li><a class="font-bold md:text-lg" href="#">Works</a></li>
            <li><a class="font-bold md:text-lg" href="#">Blog</a></li>
            <li><a class="font-bold md:text-lg" href="#">Contact</a></li>
          </ul>
        </nav>
      </div>
    </header>
    <main>
      <section class="py-16">
        <div
          class="max-w-[860px] mx-auto px-4 flex flex-col items-center justify-center gap-8 md:flex-row"
        >
          <img
            class="w-[170px] h-[170px] rounded-full object-cover shadow-[-4px_9px_0px_#edf9fa] md:order-2 md:w-[240px] md:h-[240px]"
            src="./images/hero.jpg"
            alt=""
          />
          <div class="text-center md:text-left md:max-w-[500px]">
            <h1 class="text-4xl font-bold text-[21243d] mb-4">
              Hi, I am John, Creative Technologist
            </h1>
            <p class="text-base mb-6">
              Amet minim mollit non deserunt ullamco est sit aliqua dolor do
              amet sint. Velit officia consequat duis enim velit mollit.
              Exercitation veniam consequat sunt nostrud amet.
            </p>
            <a
              class="py-2 px-6 bg-[#ff6464] text-white rounded-sm text-base hover:bg-white hover:text-[#ff6464] transition-colors"
              href="#"
              download="#"
              >Download Resume</a
            >
          </div>
        </div>
      </section>
    </main>
  </body>
</html>
